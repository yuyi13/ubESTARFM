name: Cross-language acceptance

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maintained packages
        run: |
          R CMD INSTALL .
          python -m pip install -e 'python[test]'

      - name: Run shared acceptance
        run: python -m pytest tests/cross_language/test_cross_language.py -v
