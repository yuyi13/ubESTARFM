name: R check

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rcmdcheck
          needs: check

      - name: Verify published artifacts
        run: sha256sum -c tests/fixtures/legacy/SHA256SUMS

      - name: Parse archival R scripts
        run: >-
          Rscript -e 'files <- list.files("legacy", pattern = "[.]R$",
          recursive = TRUE, full.names = TRUE); for (f in files) parse(file = f)'

      - name: R CMD check
        run: |
          R CMD build .
          R CMD check --no-manual ubestarfm_*.tar.gz
